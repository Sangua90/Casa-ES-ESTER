# Esempio opzionale: importa come automazione se desideri notifiche.
# Non viene installato o attivato automaticamente.
alias: E.S.T.E.R. - domanda Shadow
triggers:
  - trigger: event
    event_type: ester_question
actions:
  - action: persistent_notification.create
    data:
      notification_id: "ester_question_{{ trigger.event.data.question_id }}"
      title: "E.S.T.E.R. — richiede input"
      message: >-
        {{ trigger.event.data.title }}:
        {{ trigger.event.data.prompt }}
        Confidence {{ (trigger.event.data.confidence * 100) | round }}%.
        Apri la dashboard E.S.T.E.R. e rispondi nel campo Answer current question.
mode: queued
max: 10
