name: Shadow integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.4 ruff
      - run: ruff check custom_components tests --select E9,F63,F7,F82
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
