name: Shadow integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.4 ruff playwright
      - run: python -m playwright install --with-deps webkit
      - run: ruff check custom_components tests --select E9,F63,F7,F82
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/ester/frontend/ester-panel.js
      - run: node tests/test_panel.cjs
      - run: python -m unittest discover -s tests -v
        env:
          ESTER_BROWSER_TEST: '1'
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ester-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish the tested manifest version for HACS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/ester/manifest.json"))["version"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "E.S.T.E.R. $VERSION" --notes-file docs/RELEASE.md --latest
