add_context:
  name: "Aggiungi contesto"
  description: "Contesto temporaneo interno; scadenza predefinita 24 ore."
  fields:
    label:
      name: "label"
      description: "Nome del contesto"
      selector:
        text: {}
    mode:
      name: "mode"
      description: "normal, vacation, guests, illness o work_from_home"
      selector:
        text: {}
    starts_at:
      name: "starts_at"
      description: "Inizio ISO 8601 con fuso orario"
      selector:
        text: {}
    ends_at:
      name: "ends_at"
      description: "Fine ISO 8601 con fuso orario"
      selector:
        text: {}
    areas:
      name: "areas"
      description: "ID aree; vuoto significa tutta la casa"
      selector:
        object: {}
    notes:
      name: "notes"
      description: "Note locali (non inviate a Gemini)"
      selector:
        text: {}
remove_context:
  name: "Rimuovi contesto"
  description: "Rimuove un contesto usando il suo ID."
  fields:
    event_id:
      name: "event_id"
      description: "ID del contesto"
      selector:
        text: {}
add_feedback:
  name: "Feedback decisione"
  description: "Registra o aggiorna una valutazione; non esegue la proposta."
  fields:
    decision_id:
      name: "decision_id"
      description: "ID decisione"
      selector:
        text: {}
    rating:
      name: "rating"
      description: "correct, wrong o partial"
      selector:
        text: {}
    comment:
      name: "comment"
      description: "Commento"
      selector:
        text: {}
classify_entity:
  name: "Classifica entità"
  description: "Corregge il modello E.S.T.E.R. senza cambiare il registro HA."
  fields:
    entity_id:
      name: "entity_id"
      description: "Entità da classificare"
      selector:
        text: {}
    role:
      name: "role"
      description: "Ruolo del sensore o dispositivo"
      selector:
        text: {}
    area_id:
      name: "area_id"
      description: "ID area Home Assistant"
      selector:
        text: {}
set_preference:
  name: "Preferenza"
  description: "Imposta preferenze locali: comfort, energia, batteria, limiti, ACS, COP, luce e orari antifurto."
  fields:
    key:
      name: "key"
      description: "Chiave preferenza"
      selector:
        text: {}
    value:
      name: "value"
      description: "Valore numerico"
      selector:
        number:
          mode: box
evaluate:
  name: "Valuta adesso"
  description: "Aggiorna osservazioni e proposte Shadow."
get_summary:
  name: "Riepilogo"
  description: "Restituisce stanze, contesti e registro decisioni (risposta obbligatoria)."
  fields:
    limit:
      name: "limit"
      description: "Numero decisioni da restituire, da 1 a 100"
      selector:
        number:
          mode: box
explain_decision:
  name: "Spiega decisione"
  description: "Spiegazione locale; con AI abilitata invia solo un riepilogo a Gemini."
  fields:
    decision_id:
      name: "decision_id"
      description: "ID decisione"
      selector:
        text: {}

set_usage_profile:
  name: "Profilo uso stanza"
  description: "Salva come si prevede di usare una stanza; non comanda dispositivi."
  fields:
    profile_id:
      name: "profile_id"
      description: "Opzionale: riusa un ID esistente per aggiornare il profilo."
      selector:
        text: {}
    area_id:
      name: "area_id"
      description: "ID area Home Assistant"
      selector:
        text: {}
    label:
      name: "label"
      description: "Descrizione della routine, ad esempio Salotto weekend sera"
      selector:
        text: {}
    weekdays:
      name: "weekdays"
      description: "Giorni in cui vale la routine"
      selector:
        select:
          multiple: true
          options:
            - {label: "Lunedì", value: "0"}
            - {label: "Martedì", value: "1"}
            - {label: "Mercoledì", value: "2"}
            - {label: "Giovedì", value: "3"}
            - {label: "Venerdì", value: "4"}
            - {label: "Sabato", value: "5"}
            - {label: "Domenica", value: "6"}
    start_time:
      name: "start_time"
      description: "HH:MM"
      selector:
        text: {}
    end_time:
      name: "end_time"
      description: "HH:MM"
      selector:
        text: {}
    expected_occupancy:
      name: "expected_occupancy"
      description: "Probabilità attesa da 0 a 1"
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    comfort_c:
      name: "comfort_c"
      description: "Comfort desiderato quando la routine è attiva"
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          mode: box
    notes:
      name: "notes"
      selector:
        text: {}
remove_usage_profile:
  name: "Rimuovi profilo uso"
  description: "Rimuove una routine prevista usando il suo ID."
  fields:
    profile_id:
      name: "profile_id"
      selector:
        text: {}

answer_question:
  name: "Rispondi a E.S.T.E.R."
  description: "Risponde a una domanda aperta e salva ciò che può essere appreso in modo sicuro."
  fields:
    question_id:
      name: "ID domanda"
      selector:
        text: {}
    answer:
      name: "Risposta"
      selector:
        text:
          multiline: true
dismiss_question:
  name: "Ignora domanda"
  description: "Archivia una domanda senza creare memoria."
  fields:
    question_id:
      name: "ID domanda"
      selector:
        text: {}

interpret_message:
  name: "Insegna a E.S.T.E.R."
  description: "Interpreta una frase come memoria, contesto, preferenza o routine. Non comanda dispositivi."
  fields:
    message:
      name: "Messaggio"
      selector:
        text:
          multiline: true

export_memory:
  name: "Esporta memoria"
  description: "Restituisce la memoria portabile di E.S.T.E.R. senza lo storico grezzo Recorder."

set_flexible_load:
  name: "Carico flessibile"
  description: "Registra o aggiorna un carico pianificabile; in Shadow non viene comandato."
  fields:
    load_id:
      name: "ID carico"
      selector:
        text: {}
    name:
      name: "Nome"
      selector:
        text: {}
    entity_id:
      name: "Entità"
      selector:
        entity: {}
    power_w:
      name: "Potenza stimata W"
      selector:
        number:
          min: 0
          max: 50000
          mode: box
    duration_minutes:
      name: "Durata tipica minuti"
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    priority:
      name: "Priorità"
      description: "1 = massima, 100 = minima"
      selector:
        number:
          min: 1
          max: 100
          mode: box
    min_soc:
      name: "SOC minimo"
      selector:
        number:
          min: 0
          max: 100
          mode: box
    interruptible:
      name: "Interrompibile"
      selector:
        boolean: {}
    area_id:
      name: "Area"
      selector:
        text: {}

remove_flexible_load:
  name: "Rimuovi carico flessibile"
  fields:
    load_id:
      name: "ID carico"
      selector:
        text: {}
